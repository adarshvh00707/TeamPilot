# Render Blueprint (free plan): one web service running the API and worker together.
# Free services sleep after 15 min without traffic; background jobs pause while asleep.
# For production, split into a `web` + `worker` on paid plans using node-service.Dockerfile.
# Values marked `sync: false` are entered in the Render dashboard when the Blueprint is created.
services:
  - type: web
    name: teampilot-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/combined.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_CA_FILE
        value: /app/certs/supabase-prod-ca-2021.crt
      - key: DATABASE_POOL_MAX
        value: "3"
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGINS
        value: https://teampilot-ai.expo.app
# Optional, add in the service's Environment tab if needed: SUPABASE_JWT_SECRET, EXPO_ACCESS_TOKEN.
