# Render Blueprint: API (public web service) + worker (background worker).
# Render passes service env vars to the Docker build as build args, which selects SERVICE.
# Values marked `sync: false` are entered in the Render dashboard when the Blueprint is created.
envVarGroups:
  - name: teampilot-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_CA_FILE
        value: /app/certs/supabase-prod-ca-2021.crt
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: REDIS_URL
        sync: false

services:
  - type: web
    name: teampilot-api
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/docker/node-service.Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - fromGroup: teampilot-shared
      - key: SERVICE
        value: api
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: teampilot-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/docker/node-service.Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - fromGroup: teampilot-shared
      - key: SERVICE
        value: worker
      - key: EXPO_ACCESS_TOKEN
        sync: false
