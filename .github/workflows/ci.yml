name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit, API integration, migrations + RLS on PGlite)
        run: npm test
      - name: Build API and worker
        run: npm run build
      - name: Expo doctor
        working-directory: apps/mobile
        run: npx --yes expo-doctor
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: docker build -f infra/docker/node-service.Dockerfile --build-arg SERVICE=${{ matrix.service }} -t teampilot-${{ matrix.service }}:ci .
